[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piiredact"
version = "0.1.0"
description = "Local PII redactor: finds personal and company data in files and swaps it for consistent, format-preserving fakes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "PyYAML>=6",
  "Faker>=24",
  "phonenumbers>=8.13",
  "openpyxl>=3.1",
  "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]
model = ["gliner>=0.2", "torch>=2.2"]
demo = ["streamlit>=1.35"]

[project.scripts]
piiredact = "piiredact.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/piiredact"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format owns line length

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "gliner.*", "openpyxl.*", "faker.*", "phonenumbers.*", "streamlit.*", "spacy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# streamlit is an optional extra; without it installed its decorators are untyped
module = ["piiredact.app.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=piiredact --cov-report=term-missing"

[tool.coverage.run]
# need downloaded models / a browser; exercised by the eval runs, not by unit tests in CI
omit = ["src/piiredact/detect/gliner_det.py", "src/piiredact/detect/presidio_det.py", "src/piiredact/app/*"]
